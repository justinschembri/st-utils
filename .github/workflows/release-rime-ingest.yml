# Build and push rime-ingest to GHCR when a package version tag is pushed.
# Git tag is the source of truth: rime-ingest-vX.Y.Z → image :X.Y.Z
# Publish only runs after tests pass on the tagged commit.
name: Release rime-ingest

on:
  push:
    tags:
      - "rime-ingest-v*"

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run non-auth tests
        run: uv run pytest -m "not real and not online and not docker"

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          tag="${{ github.ref_name }}"
          prefix="rime-ingest-"
          if [[ "$tag" != ${prefix}* ]]; then
            echo "Tag '$tag' does not start with '$prefix'" >&2
            exit 1
          fi
          semver="${tag#"$prefix"}"
          if [[ ! "$semver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Expected SemVer after prefix, got '$semver' (want vX.Y.Z)" >&2
            exit 1
          fi
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "version=${semver#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/rime-ingest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/rime-ingest
          file: packages/rime-ingest/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
